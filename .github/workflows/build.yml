name: Compilar APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Llave de firma (se crea una sola vez y se guarda en el repo)
        run: |
          if [ -f app/launcher.jks.b64 ]; then
            base64 -d app/launcher.jks.b64 > app/launcher.jks
          else
            keytool -genkeypair -keystore app/launcher.jks -storepass milauncher -keypass milauncher -alias milauncher -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Mi Launcher, C=PE"
            base64 -w0 app/launcher.jks > app/launcher.jks.b64
            git config user.name "github-actions"
            git config user.email "github-actions@users.noreply.github.com"
            git add app/launcher.jks.b64
            git commit -m "Llave de firma"
            git push
          fi

      - name: Compilar
        run: |
          gradle :app:assembleRelease --no-daemon

      - name: Renombrar APK
        run: cp app/build/outputs/apk/release/app-release.apk MiLauncher-v1.0.${{ github.run_number }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: MiLauncher-apk
          path: MiLauncher-*.apk

      - name: Publicar en Releases (descarga directa desde el celular)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Mi Launcher v1.0.${{ github.run_number }}
          files: MiLauncher-*.apk
          make_latest: true
